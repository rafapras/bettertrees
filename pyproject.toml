[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bettertrees"
dynamic = ["version"]
description = "Fast decision trees and interpretable sums of optimal trees for binary classification"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "rafapras" }]
dependencies = [
    "numpy>=1.26",
    "numba>=0.60",
    "scikit-learn>=1.6",  # validate_data e tags de estimador
]

[project.optional-dependencies]
# gain-importance feature screening when p > 128 (without it: FAST screening)
lightgbm = ["lightgbm>=4.0"]
test = ["pytest>=8", "scipy", "pandas", "matplotlib", "shap", "lightgbm>=4.0"]
plot = ["matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "bettertrees.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# estilo que não briga com kernels Numba (laços explícitos, min/max manuais)
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E731",    # lambdas curtas para nomes de feature
    "RUF001",  # texto em português (acentos, sinais)
    "RUF002",
    "RUF003",
    "B905",    # zip sem strict: pares de mesmo tamanho por construção
    "SIM108",  # ternário nem sempre é mais legível
    "RUF046",  # int(round(x)) com escalares numpy: explícito de propósito
]

[tool.ruff.lint.per-file-ignores]
"tests/_core.py" = ["F401", "E402"]  # test facade: re-exports internals
"tests/*" = ["E501", "E741", "B018", "RUF007", "RUF015", "RUF059"]  # test style: short names, attribute-access asserts

[tool.ruff.lint.isort]
known-first-party = ["bettertrees"]
