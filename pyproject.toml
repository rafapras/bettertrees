[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bettertrees"
dynamic = ["version"]
description = "Interleaved Tree Models: small, readable sums of trees for binary classification under a budget of cuts"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Rafael do Prado Silva" }]
keywords = [
    "decision trees", "interpretable machine learning", "FIGS", "sum of trees",
    "credit scoring", "scikit-learn",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26,<3",
    "numba>=0.60",
    "scikit-learn>=1.6,<2",  # validate_data and estimator tags
]

[project.optional-dependencies]
# gain-importance feature screening when p > 128 (without it: FAST screening)
lightgbm = ["lightgbm>=4.0"]
plot = ["matplotlib>=3.8"]
# to_shap_model() output is read by shap.TreeExplainer
shap = ["shap>=0.45"]
all = ["lightgbm>=4.0", "matplotlib>=3.8", "shap>=0.45", "pandas>=2.0"]
test = ["pytest>=8", "scipy", "pandas", "matplotlib", "shap", "lightgbm>=4.0"]
# executing the example notebooks (tools/build_examples.py)
examples = ["pandas", "matplotlib", "nbformat", "nbclient", "ipykernel"]
typing = ["mypy>=1.15"]  # the stubs are checked in CI

[project.urls]
Homepage = "https://github.com/rafapras/bettertrees"
Repository = "https://github.com/rafapras/bettertrees"
Issues = "https://github.com/rafapras/bettertrees/issues"
Changelog = "https://github.com/rafapras/bettertrees/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bettertrees = ["py.typed", "sums/*.pyi"]

[tool.setuptools.dynamic]
version = { attr = "bettertrees.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.mypy]
files = ["tools/typing_smoke.py"]
mypy_path = "src"
follow_imports = "silent"
ignore_missing_imports = true
strict = true

# scikit-learn ships no annotations, so its base classes are Any for mypy
[[tool.mypy.overrides]]
module = "bettertrees.sums.budget"
disallow_subclassing_any = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# a style that does not fight Numba kernels (explicit loops, manual min/max)
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E731",    # short lambdas for feature names
    "B905",    # zip without strict: equal-length pairs by construction
    "SIM108",  # a ternary is not always more readable
    "RUF046",  # int(round(x)) on numpy scalars: explicit on purpose
]

[tool.ruff.lint.per-file-ignores]
"tests/_core.py" = ["F401", "E402"]  # test facade: re-exports internals
"src/bettertrees/lab/itm.py" = ["E501", "RUF059"]  # research code: long formulas
"tests/*" = ["E501", "E741", "B018", "RUF007", "RUF015", "RUF059"]  # test style: short names, attribute-access asserts

[tool.ruff.lint.isort]
known-first-party = ["bettertrees"]
