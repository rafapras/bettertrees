name: CI

# Minimal on purpose: one Linux job. Add an OS/Python matrix once there are users.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[test]" ruff
      - run: ruff check src tests tools
      - run: python -m pytest -q
