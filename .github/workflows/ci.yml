name: CI

# Minimal on purpose: one Linux job. Add an OS/Python matrix once there are users.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[test,examples]" ruff build twine
      - run: ruff check src tests tools examples/credit_data.py
      - run: python -m pytest -q
      # the notebooks are re-executed: a broken example fails the build
      - run: python tools/build_examples.py
      - run: python tools/check_readme.py
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python tools/check_distribution.py dist
