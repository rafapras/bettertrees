name: CI

# Minimal on purpose: one Linux job per supported Python (3.10 to 3.14, as in pyproject.toml).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[test,examples,typing]" ruff build twine
      - run: ruff check src tests tools examples/credit_data.py
      - run: python -m mypy
      - run: python -m pytest -q
      # the notebooks are re-executed: a broken example fails the build
      - run: python tools/build_examples.py
      - run: python tools/check_readme.py
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python tools/check_distribution.py dist
